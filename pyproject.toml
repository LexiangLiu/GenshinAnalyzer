[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-artifact-simulator"
version = "0.1.0"
description = "Offline five-star artifact simulation and inventory"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
artifact-sim = "artifact_sim.__main__:main"

[tool.setuptools]
packages = [
    "artifact_sim",
    "artifact_sim.core",
    "artifact_sim.data",
    "artifact_sim.damage",
    "artifact_sim.inventory",
    "artifact_sim.optimization",
    "artifact_sim.planning",
]

[tool.setuptools.package-data]
"artifact_sim.data" = [
    "data.json",
    "reference_data/manifest.json",
    "reference_data/*.json.gz",
]
"artifact_sim.damage" = [
    "character_models.json",
    "go_damage/manifest.json",
    "go_damage/bridge.mjs",
    "go_damage/LICENSE-*.txt",
]
