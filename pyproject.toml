[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-artifact-simulator"
version = "0.1.0"
description = "Offline five-star artifact simulation and inventory"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
artifact-sim = "artifact_sim.__main__:main"

[tool.setuptools]
packages = [
    "artifact_sim",
    "genshin_simulator",
    "genshin_simulator.core",
    "genshin_simulator.data",
    "genshin_simulator.damage",
    "genshin_simulator.inventory",
    "genshin_simulator.optimization",
    "genshin_simulator.planning",
]

[tool.setuptools.package-data]
"genshin_simulator.data" = [
    "data.json",
    "reference_data/manifest.json",
    "reference_data/*.json.gz",
]
"genshin_simulator.damage" = [
    "character_models.json",
    "go_damage/manifest.json",
    "go_damage/bridge.mjs",
    "go_damage/LICENSE-*.txt",
]
